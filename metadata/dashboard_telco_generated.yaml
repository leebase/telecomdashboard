    - id: ua_trends
      title: Trends
      rows:
      - - chart: chart_plan_usage_mix
        - chart: chart_feature_adoption_trend
      - - chart: chart_usage_distribution
- id: operational_efficiency
  title: "\U0001F6E0\uFE0F Operational Efficiency"
  icon: wrench
  order: 5
  description: Operational performance, compliance, and reliability.
  default_filters:
  - date_range
  - ops_region
  layout:
    grid_columns: 12
    sections:
    - id: ops_cards
      title: Key KPIs
      rows:
      - - kpi_card: kpi_service_response_time
        - kpi_card: kpi_reg_compliance
        - kpi_card: kpi_capex_ratio
      - - kpi_card: kpi_network_efficiency
        - kpi_card: kpi_ticket_resolution
        - kpi_card: kpi_system_uptime
    - id: ops_trends
      title: Trends
      rows:
      - - chart: chart_response_time_region
        - chart: chart_incident_heatmap
      - - chart: chart_uptime_trend_ops
- id: benchmark_management
  title: "\U0001F3AF Benchmark Management"
  icon: target
  order: 6
  description: Maintain peer and industry benchmark targets.
  default_filters: []
  layout:
    grid_columns: 12
    sections:
    - id: bm_editor
      title: Benchmarks
      rows:
      - - widget: widget_benchmark_table
      - - widget: widget_benchmark_history
      - - widget: widget_benchmark_editor
kpis:
- id: kpi_network_availability
  title: Network Availability
  subject_area: network_performance
  description: Percentage of time the network is operational.
  owner: lee.chen@company.com
  tags:
  - sla
  - uptime
  metrics:
  - id: metric_network_availability
    data_source: sqlite_cache
    fallback_source: sqlite_cache
    sql: "SELECT\n  f.date_id AS date,\n  r.region_name AS region,\n  AVG(100.0 *\
      \ f.uptime_seconds / NULLIF(f.uptime_seconds + f.downtime_seconds, 0)) AS availability_pct,\n\
      \  MAX(100.0 * f.uptime_seconds / NULLIF(f.uptime_seconds + f.downtime_seconds,\
      \ 0)) AS max_availability\nFROM fact_network_metrics AS f\nJOIN dim_region AS\
      \ r ON r.region_id = f.region_id\nWHERE f.date_id BETWEEN {{ date_range.start\
      \ }} AND {{ date_range.end }}\n  {% if filters.region %}AND r.region_name =\
      \ {{ filters.region | quote }}{% endif %}\nGROUP BY 1, 2\n"
    dimensions:
    - date
    - region
    cache_ttl_seconds: 300
    thresholds:
      good: '>= 99.7'
      warn: '>= 99.0'
      bad: < 99.0
  widgets:
    primary:
      type: kpi_card
      dataset: metric_network_availability
      value_expr: last_value(availability_pct)
      delta_expr: percent_delta(availability_pct)
      unit: '%'
      decimals: 2
    secondary:
    - chart_id: chart_uptime_trend
      type: timeseries_line
      dataset: metric_network_availability
      encoding:
        x: date
        y: availability_pct
        color: region
        tooltip:
        - date
        - region
        - availability_pct
- id: kpi_network_latency
  title: Average Latency
  subject_area: network_performance
  description: Average network latency in milliseconds.
  owner: lee.chen@company.com
  tags:
  - latency
  metrics:
  - id: metric_network_latency
    data_source: sqlite_cache
    sql: "SELECT\n  f.date_id AS date,\n  r.region_name AS region,\n  AVG(f.latency_ms)\
      \ AS latency_ms\nFROM fact_network_metrics AS f\nJOIN dim_region AS r ON r.region_id\
      \ = f.region_id\nWHERE f.date_id BETWEEN {{ date_range.start }} AND {{ date_range.end\
      \ }}\n  {% if filters.region %}AND r.region_name = {{ filters.region | quote\
      \ }}{% endif %}\nGROUP BY 1, 2\n"
    dimensions:
    - date
    - region
    cache_ttl_seconds: 300
    thresholds:
      good: <= 40
      warn: <= 60
      bad: '> 60'
  widgets:
    primary:
      type: kpi_card
      dataset: metric_network_latency
      value_expr: last_value(latency_ms)
      delta_expr: delta(latency_ms)
      unit: ms
      decimals: 1
    secondary:
    - chart_id: chart_latency_trend
      type: timeseries_line
      dataset: metric_network_latency
      encoding:
        x: date
        y: latency_ms
        color: region
