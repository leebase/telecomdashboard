auxiliary_metrics:
- id: metric_benchmark_history
  data_source: sqlite_cache
  sql: "SELECT\n  kpi_name,\n  old_peer_avg,\n  new_peer_avg,\n  old_industry_avg,\n\
    \  new_industry_avg,\n  changed_by,\n  changed_at\nFROM benchmark_history\nORDER\
    \ BY changed_at DESC\n"
- id: metric_support_ticket_volume
  data_source: sqlite_cache
  sql: "SELECT\n  o.date_id AS date,\n  r.region_name AS region,\n  SUM(o.incident_count)\
    \ AS open_tickets,\n  SUM(o.incident_count * o.support_ticket_resolution_rate)\
    \ AS resolved_tickets\nFROM fact_operations AS o\nJOIN dim_region AS r ON r.region_id\
    \ = o.region_id\nWHERE o.date_id BETWEEN {{ date_range.start }} AND {{ date_range.end\
    \ }}\nGROUP BY 1, 2\n"
- id: metric_customer_sentiment
  data_source: sqlite_cache
  sql: "SELECT\n  CASE\n    WHEN satisfaction_score >= 90 THEN 'Promoter'\n    WHEN\
    \ satisfaction_score >= 75 THEN 'Passive'\n    ELSE 'Detractor'\n  END AS sentiment_bucket,\n\
    \  COUNT(*) AS responses\nFROM fact_customer_experience\nWHERE date_id BETWEEN\
    \ {{ date_range.start }} AND {{ date_range.end }}\nGROUP BY 1\n"
- id: metric_product_revenue_mix
  data_source: sqlite_cache
  sql: "SELECT\n  p.product_category AS product_family,\n  SUM(f.revenue_amount) AS\
    \ revenue\nFROM fact_revenue AS f\nJOIN dim_product AS p ON p.product_id = f.product_id\n\
    WHERE f.date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}\nGROUP\
    \ BY 1\n"
- id: metric_revenue_trend
  data_source: sqlite_cache
  sql: "SELECT\n  date_id AS date,\n  SUM(total_revenue) AS revenue\nFROM vw_revenue_daily\n\
    WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}\nGROUP BY\
    \ 1\n"
- id: metric_revenue_forecast
  data_source: sqlite_cache
  sql: "SELECT\n  date_id AS date,\n  SUM(total_revenue) AS revenue,\n  SUM(total_revenue)\
    \ * 0.95 AS lower_ci,\n  SUM(total_revenue) * 1.05 AS upper_ci\nFROM vw_revenue_daily\n\
    WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}\nGROUP BY\
    \ 1\n"
- id: metric_financial_summary
  data_source: sqlite_cache
  sql: "WITH aggregated AS (\n  SELECT\n    SUM(total_revenue) AS total_revenue,\n\
    \    AVG(avg_arpu) AS avg_arpu,\n    AVG(avg_cac) AS avg_cac,\n    AVG(avg_profit_margin)\
    \ AS avg_profit_margin\n  FROM vw_revenue_daily\n  WHERE date_id BETWEEN {{ date_range.start\
    \ }} AND {{ date_range.end }}\n)\nSELECT 'Total Revenue' AS metric_name, total_revenue\
    \ AS metric_value, '$' AS unit FROM aggregated\nUNION ALL\nSELECT 'Average ARPU',\
    \ avg_arpu, '$' FROM aggregated\nUNION ALL\nSELECT 'Average CAC', avg_cac, '$'\
    \ FROM aggregated\nUNION ALL\nSELECT 'Profit Margin', avg_profit_margin, '%' FROM\
    \ aggregated\n"
- id: metric_plan_usage_mix
  data_source: sqlite_cache
  sql: "SELECT\n  p.product_type AS plan_type,\n  SUM(f.active_subscribers) AS subscribers,\n\
    \  SUM(f.data_usage_gb) AS data_usage_gb\nFROM fact_usage_adoption AS f\nJOIN\
    \ dim_product AS p ON p.product_id = f.product_id\nWHERE f.date_id BETWEEN {{\
    \ date_range.start }} AND {{ date_range.end }}\nGROUP BY 1\n"
- id: metric_feature_adoption_trend
  data_source: sqlite_cache
  sql: "SELECT\n  u.date_id AS date,\n  r.region_name AS feature_name,\n  AVG(u.avg_feature_adoption)\
    \ AS adoption_pct\nFROM vw_usage_adoption_daily AS u\nJOIN dim_region AS r ON\
    \ r.region_id = u.region_id\nWHERE u.date_id BETWEEN {{ date_range.start }} AND\
    \ {{ date_range.end }}\nGROUP BY 1, 2\n"
- id: metric_usage_distribution
  data_source: sqlite_cache
  sql: "SELECT\n  CASE\n    WHEN avg_data_usage < 2 THEN '0-2 GB'\n    WHEN avg_data_usage\
    \ < 5 THEN '2-5 GB'\n    WHEN avg_data_usage < 10 THEN '5-10 GB'\n    ELSE '10+\
    \ GB'\n  END AS usage_bucket,\n  SUM(total_active_subscribers) AS subscriber_count\n\
    FROM vw_usage_adoption_daily\nWHERE date_id BETWEEN {{ date_range.start }} AND\
    \ {{ date_range.end }}\nGROUP BY 1\nORDER BY usage_bucket\n"
- id: metric_response_time_region
  data_source: sqlite_cache
  sql: "SELECT\n  r.region_name AS region,\n  AVG(o.avg_response_time) AS response_time_hours\n\
    FROM vw_operations_daily AS o\nJOIN dim_region AS r ON r.region_id = o.region_id\n\
    WHERE o.date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}\nGROUP\
    \ BY 1\n"
- id: metric_incident_heatmap
  data_source: sqlite_cache
  sql: "SELECT\n  r.region_name AS region,\n  CASE\n    WHEN o.incident_count < 5\
    \ THEN 'Low'\n    WHEN o.incident_count < 10 THEN 'Moderate'\n    ELSE 'High'\n\
    \  END AS severity,\n  COUNT(*) AS incident_count\nFROM fact_operations AS o\n\
    JOIN dim_region AS r ON r.region_id = o.region_id\nWHERE o.date_id BETWEEN {{\
    \ date_range.start }} AND {{ date_range.end }}\nGROUP BY 1, 2\n"
- id: metric_system_uptime_trend
  data_source: sqlite_cache
  sql: "SELECT\n  date_id AS date,\n  AVG(avg_uptime) AS system_uptime_pct\nFROM vw_operations_daily\n\
    WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}\nGROUP BY\
    \ 1\n"
