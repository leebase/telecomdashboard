schema_version: 1.0
app_version: 0.9.0
pack_id: telecom_default
label: Telecom KPI Dashboard
globals:
  timezone: America/Chicago
  default_date_range: last_30_days
  currency: USD
  theme: cognizant_dark
  ai_insights_enabled: true
  print_mode_enabled: false
dialects:
  default: snowflake
  supported:
  - snowflake
  - sqlite
  macros:
    snowflake: macros/snowflake.sql
    sqlite: macros/sqlite.sql
data_sources:
  snowflake_main:
    dialect: snowflake
    dsn_env: SNOWFLAKE_DSN
    role: ANALYST
    warehouse: KPI_WH
    database: TELECOM
    schema: ANALYTICS
  sqlite_cache:
    dialect: sqlite
    path: ../data/telecom_db.sqlite
    read_only: true
filters:
  global:
  - id: date_range
    type: date_range
    label: Date Range
    default: last_30_days
    options:
    - last_7_days
    - last_30_days
    - qtd
    - ytd
    - last_12_months
    bindings:
      start_param: start_date
      end_param: end_date
  - id: region
    type: select
    label: Region
    data_source: sqlite_cache
    sql: SELECT DISTINCT region_name FROM dim_region ORDER BY region_name
    allow_blank: true
  subject_area:
    network_performance:
    - id: network_element
      type: multiselect
      label: Network Element
      data_source: sqlite_cache
      sql: SELECT DISTINCT element_name FROM dim_network_element ORDER BY element_name
      allow_blank: true
    customer_experience: []
    revenue_monetization: []
    usage_adoption: []
    operational_efficiency:
    - id: ops_region
      type: select
      label: Operations Region
      data_source: sqlite_cache
      sql: SELECT DISTINCT region_name FROM dim_region ORDER BY region_name
      allow_blank: true
    benchmark_management: []
subject_areas:
- id: network_performance
  title: "\U0001F4E1 Network Performance"
  icon: antenna
  order: 1
  description: Uptime, latency, and reliability metrics.
  default_filters:
  - date_range
  - region
  layout:
    grid_columns: 12
    sections:
    - id: np_cards
      title: Key KPIs
      rows:
      - - kpi_card: kpi_network_availability
        - kpi_card: kpi_network_latency
        - kpi_card: kpi_packet_loss
      - - kpi_card: kpi_bandwidth_utilization
        - kpi_card: kpi_dropped_call_rate
        - kpi_card: kpi_mttr
    - id: np_trends
      title: Trends
      rows:
      - - chart: chart_latency_trend
        - chart: chart_uptime_trend
      - - chart: chart_bandwidth_region
        - chart: chart_packet_loss_trend
    - id: np_kpi_details
      title: KPI Details
      rows:
      - - widget: widget_network_kpi_expanders
- id: customer_experience
  title: "\U0001F60A Customer Experience"
  icon: smile
  order: 2
  description: Satisfaction, churn, and support operations.
  default_filters:
  - date_range
  layout:
    grid_columns: 12
    sections:
    - id: cx_cards
      title: Key KPIs
      rows:
      - - kpi_card: kpi_customer_satisfaction
        - kpi_card: kpi_nps
        - kpi_card: kpi_churn_rate
      - - kpi_card: kpi_avg_handling_time
        - kpi_card: kpi_first_contact_resolution
        - kpi_card: kpi_customer_ltv
    - id: cx_trends
      title: Trends & Sentiment
      rows:
      - - chart: chart_nps_trend
        - chart: chart_support_tickets
      - - chart: chart_customer_sentiment_distribution
- id: revenue_monetization
  title: "\U0001F4B0 Revenue & Monetization"
  icon: dollar
  order: 3
  description: Financial performance and growth metrics.
  default_filters:
  - date_range
  layout:
    grid_columns: 12
    sections:
    - id: rev_cards
      title: Key KPIs
      rows:
      - - kpi_card: kpi_arpu
        - kpi_card: kpi_ebitda_margin
        - kpi_card: kpi_cac
      - - kpi_card: kpi_revenue_growth
        - kpi_card: kpi_profit_margin
        - kpi_card: kpi_revenue_customer_ltv
    - id: rev_trends
      title: Trends
      rows:
      - - chart: chart_revenue_trend
        - chart: chart_product_mix
      - - chart: chart_revenue_forecast
    - id: rev_tables
      title: Detail
      rows:
      - - chart: chart_financial_table
- id: usage_adoption
  title: "\U0001F4F6 Usage & Adoption"
  icon: signal
  order: 4
  description: Service utilization and feature adoption.
  default_filters:
  - date_range
  layout:
    grid_columns: 12
    sections:
    - id: ua_cards
      title: Key KPIs
      rows:
      - - kpi_card: kpi_data_usage
        - kpi_card: kpi_5g_adoption
        - kpi_card: kpi_feature_adoption
      - - kpi_card: kpi_service_penetration
        - kpi_card: kpi_app_usage
