security:
  roles:
    exec:
      can_view_subject_areas:
      - network_performance
      - customer_experience
      - revenue_monetization
    analyst:
      inherits:
      - exec
      can_view_subject_areas:
      - usage_adoption
      - operational_efficiency
      - benchmark_management
    operator:
      can_view_subject_areas:
      - benchmark_management
      can_edit_widgets:
      - widget_benchmark_table
      - widget_benchmark_editor
  row_filters:
