      GROUP BY 1

widgets:
  widget_network_kpi_expanders:
    type: kpi_expandable
    dataset: metric_network_availability  # reused for lookup; runtime fetches tooltip JSON
  widget_benchmark_table:
    type: data_editor
    dataset: metric_benchmark_targets
  widget_benchmark_history:
    type: table
    dataset: metric_benchmark_history
  widget_benchmark_editor:
    type: form
    dataset: metric_benchmark_targets
  chart_support_tickets:
    type: bar_chart
    dataset: metric_support_ticket_volume
    encoding:
      x: date
      y: open_tickets
      color: region
  chart_customer_sentiment_distribution:
    type: distribution
    dataset: metric_customer_sentiment
    encoding:
      category: sentiment_bucket
      value: responses
  chart_product_mix:
    type: stacked_bar
    dataset: metric_product_revenue_mix
    encoding:
      x: product_family
      y: revenue
  chart_revenue_trend:
    type: timeseries_line
    dataset: metric_revenue_trend
    encoding:
      x: date
      y: revenue
  chart_revenue_forecast:
    type: forecast_band
    dataset: metric_revenue_forecast
    encoding:
      x: date
      y: revenue
      lower: lower_ci
      upper: upper_ci
  chart_financial_table:
    type: table
    dataset: metric_financial_summary
    columns: [metric_name, metric_value, unit]
  chart_plan_usage_mix:
    type: stacked_bar
    dataset: metric_plan_usage_mix
    encoding:
      x: plan_type
      y: subscribers
      color: plan_type
  chart_feature_adoption_trend:
    type: multi_series_line
    dataset: metric_feature_adoption_trend
    encoding:
      x: date
      y: adoption_pct
      series: feature_name
  chart_usage_distribution:
    type: distribution
    dataset: metric_usage_distribution
    encoding:
      category: usage_bucket
      value: subscriber_count
  chart_support_tickets_resolved:
    type: bar_chart
    dataset: metric_support_ticket_volume
    encoding:
      x: date
      y: resolved_tickets
      color: region
  chart_response_time_region:
    type: bar_chart
    dataset: metric_response_time_region
    encoding:
      x: region
      y: response_time_hours
  chart_incident_heatmap:
    type: heatmap
    dataset: metric_incident_heatmap
    encoding:
      x: region
      y: severity
      value: incident_count
  chart_uptime_trend_ops:
    type: timeseries_line
    dataset: metric_system_uptime_trend
    encoding:
      x: date
      y: system_uptime_pct

security:
  roles:
    exec:
      can_view_subject_areas:
        - network_performance
        - customer_experience
        - revenue_monetization
    analyst:
      inherits: [exec]
      can_view_subject_areas:
        - usage_adoption
        - operational_efficiency
        - benchmark_management
    operator:
      can_view_subject_areas:
        - benchmark_management
      can_edit_widgets:
        - widget_benchmark_table
        - widget_benchmark_editor
  row_filters:
    analyst:
      region: "{{ user.region_whitelist }}"

refresh:
  default_ttl_seconds: 300
  overrides:
    kpi_benchmark_targets: 30
    kpi_network_latency: 120
  schedule:
    cron: "*/30 * * * *"

