    tags: [customer]
    metrics:
      - id: metric_customer_satisfaction
        data_source: snowflake_main
        sql: |
          SELECT
            date_id AS date,
            AVG(customer_satisfaction_score) AS satisfaction_score
          FROM vw_customer_experience_daily
          WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
          GROUP BY 1
        dimensions: [date]
        thresholds:
          good: ">= 4.3"
          warn: ">= 3.8"
          bad: "< 3.8"
    widgets:
      primary:
        type: kpi_card
        dataset: metric_customer_satisfaction
        value_expr: last_value(satisfaction_score)
        delta_expr: delta(satisfaction_score)
        decimals: 2
  - id: kpi_nps
    title: "Net Promoter Score"
    subject_area: customer_experience
    description: "Difference between promoters and detractors."
    owner: melissa.patel@company.com
    tags: [customer, loyalty]
    metrics:
      - id: metric_nps
        data_source: snowflake_main
        sql: |
          SELECT
            date_id AS date,
            AVG(net_promoter_score) AS nps
          FROM vw_customer_experience_daily
          WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
          GROUP BY 1
        dimensions: [date]
        thresholds:
          good: ">= 40"
          warn: ">= 20"
          bad: "< 20"
    widgets:
      primary:
        type: kpi_card
        dataset: metric_nps
        value_expr: last_value(nps)
        delta_expr: delta(nps)
      secondary:
        - chart_id: chart_nps_trend
          type: timeseries_line
          dataset: metric_nps
          encoding:
            x: date
            y: nps
  - id: kpi_churn_rate
    title: "Customer Churn Rate"
    subject_area: customer_experience
    description: "Percentage of customers leaving per period."
    owner: melissa.patel@company.com
    tags: [retention]
    metrics:
      - id: metric_churn
        data_source: snowflake_main
        sql: |
          SELECT
            date_id AS date,
            SUM(churned_customers) / NULLIF(SUM(total_customers), 0) * 100 AS churn_pct
          FROM fact_customer_experience
          WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
          GROUP BY 1
        dimensions: [date]
        thresholds:
          good: "<= 2.0"
          warn: "<= 3.0"
          bad: "> 3.0"
    widgets:
      primary:
        type: kpi_card
        dataset: metric_churn
        value_expr: last_value(churn_pct)
        delta_expr: delta(churn_pct)
        unit: "%"
        decimals: 2
  - id: kpi_avg_handling_time
