# Additional datasets for benchmark history/editor actions
auxiliary_metrics:
  - id: metric_benchmark_history
    data_source: sqlite_cache
    sql: |
      SELECT
        kpi_name,
        old_peer_avg,
        new_peer_avg,
        old_industry_avg,
        new_industry_avg,
        changed_by,
        changed_at
      FROM benchmark_history
      ORDER BY changed_at DESC
  - id: metric_support_ticket_volume
    data_source: snowflake_main
    sql: |
      SELECT
        date_id AS date,
        region_name AS region,
        SUM(open_tickets) AS open_tickets,
        SUM(resolved_tickets) AS resolved_tickets
      FROM fact_support_tickets
      WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
      GROUP BY 1, 2
  - id: metric_customer_sentiment
    data_source: snowflake_main
    sql: |
      SELECT
        sentiment_bucket,
        COUNT(*) AS responses
      FROM fact_customer_sentiment
      WHERE feedback_date BETWEEN {{ date_range.start }} AND {{ date_range.end }}
      GROUP BY 1
  - id: metric_product_revenue_mix
    data_source: snowflake_main
    sql: |
      SELECT
        product_family,
        SUM(revenue_amount) AS revenue
      FROM fact_revenue_daily
      WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
      GROUP BY 1
  - id: metric_revenue_trend
    data_source: snowflake_main
    sql: |
      SELECT
        date_id AS date,
        SUM(revenue_amount) AS revenue
      FROM fact_revenue_daily
      WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
      GROUP BY 1
  - id: metric_revenue_forecast
    data_source: snowflake_main
    sql: |
      SELECT
        forecast_month AS date,
        forecast_revenue AS revenue,
        forecast_lower AS lower_ci,
        forecast_upper AS upper_ci
      FROM mart_revenue_forecast
      WHERE forecast_month BETWEEN {{ date_range.start }} AND {{ date_range.end }}
  - id: metric_financial_summary
    data_source: snowflake_main
    sql: |
      SELECT
        metric_name,
        metric_value,
        unit
      FROM mart_financial_summary
      WHERE snapshot_date = {{ date_range.end }}
  - id: metric_plan_usage_mix
    data_source: snowflake_main
    sql: |
      SELECT
        plan_type,
        SUM(subscribers) AS subscribers,
        SUM(data_usage_gb) AS data_usage_gb
      FROM fact_plan_usage
      WHERE snapshot_date BETWEEN {{ date_range.start }} AND {{ date_range.end }}
      GROUP BY 1
  - id: metric_feature_adoption_trend
    data_source: snowflake_main
    sql: |
      SELECT
        date_id AS date,
        feature_name,
        AVG(feature_adoption_percent) AS adoption_pct
      FROM vw_usage_adoption_daily
      WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
      GROUP BY 1, 2
  - id: metric_usage_distribution
    data_source: snowflake_main
    sql: |
      SELECT
        usage_bucket,
        COUNT(*) AS subscriber_count
      FROM mart_usage_histogram
      WHERE snapshot_date = {{ date_range.end }}
      GROUP BY 1
  - id: metric_response_time_region
    data_source: snowflake_main
    sql: |
      SELECT
        region_name AS region,
        AVG(service_response_time_hours) AS response_time_hours
      FROM vw_operations_daily
      WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
      GROUP BY 1
  - id: metric_incident_heatmap
