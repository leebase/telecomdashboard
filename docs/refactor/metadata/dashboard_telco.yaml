schema_version: 1.0
app_version: "0.9.0"
pack_id: telecom_default
label: "Telecom KPI Dashboard"
globals:
  timezone: America/Chicago
  default_date_range: last_30_days
  currency: USD
  theme: cognizant_dark
  ai_insights_enabled: true
  print_mode_enabled: false
dialects:
  default: snowflake
  supported:
    - snowflake
    - sqlite
  macros:
    snowflake: macros/snowflake.sql
    sqlite: macros/sqlite.sql

# Data sources map to env vars for Snowflake and local SQLite cache
# Assumption: SNOWFLAKE_DSN environment key already provisioned.
data_sources:
  snowflake_main:
    dialect: snowflake
    dsn_env: SNOWFLAKE_DSN
    role: ANALYST
    warehouse: KPI_WH
    database: TELECOM
    schema: ANALYTICS
  sqlite_cache:
    dialect: sqlite
    path: ./data/telecom_db.sqlite
    read_only: true

filters:
  global:
    - id: date_range
      type: date_range
      label: Date Range
      default: last_30_days
      options: [last_7_days, last_30_days, qtd, ytd, last_12_months]
      bindings:
        start_param: start_date
        end_param: end_date
    - id: region
      type: select
      label: Region
      data_source: snowflake_main
      sql: "SELECT DISTINCT region_name FROM dim_region ORDER BY region_name"
      allow_blank: true
  subject_area:
    network_performance:
      - id: network_element
        type: multiselect
        label: Network Element
        data_source: snowflake_main
        sql: "SELECT DISTINCT element_name FROM dim_network_element ORDER BY element_name"
        allow_blank: true
    customer_experience: []
    revenue_monetization: []
    usage_adoption: []
    operational_efficiency:
      - id: ops_region
        type: select
        label: Operations Region
        data_source: snowflake_main
        sql: "SELECT DISTINCT region_name FROM dim_region ORDER BY region_name"
        allow_blank: true
    benchmark_management: []

subject_areas:
  - id: network_performance
    title: "📡 Network Performance"
    icon: antenna
    order: 1
    description: "Uptime, latency, and reliability metrics."
    default_filters: [date_range, region]
    layout:
      grid_columns: 12
      sections:
        - id: np_cards
          title: "Key KPIs"
          rows:
            - [ {kpi_card: kpi_network_availability}, {kpi_card: kpi_network_latency}, {kpi_card: kpi_packet_loss} ]
            - [ {kpi_card: kpi_bandwidth_utilization}, {kpi_card: kpi_dropped_call_rate}, {kpi_card: kpi_mttr} ]
        - id: np_trends
          title: "Trends"
          rows:
            - [ {chart: chart_latency_trend}, {chart: chart_uptime_trend} ]
            - [ {chart: chart_bandwidth_region}, {chart: chart_packet_loss_trend} ]
        - id: np_kpi_details
          title: "KPI Details"
          rows:
            - [ {widget: widget_network_kpi_expanders} ]
  - id: customer_experience
    title: "😊 Customer Experience"
    icon: smile
    order: 2
    description: "Satisfaction, churn, and support operations."
    default_filters: [date_range]
    layout:
      grid_columns: 12
      sections:
        - id: cx_cards
          title: "Key KPIs"
          rows:
            - [ {kpi_card: kpi_customer_satisfaction}, {kpi_card: kpi_nps}, {kpi_card: kpi_churn_rate} ]
            - [ {kpi_card: kpi_avg_handling_time}, {kpi_card: kpi_first_contact_resolution}, {kpi_card: kpi_customer_ltv} ]
        - id: cx_trends
          title: "Trends & Sentiment"
          rows:
            - [ {chart: chart_nps_trend}, {chart: chart_support_tickets} ]
            - [ {chart: chart_customer_sentiment_distribution} ]
  - id: revenue_monetization
    title: "💰 Revenue & Monetization"
    icon: dollar
    order: 3
    description: "Financial performance and growth metrics."
    default_filters: [date_range]
    layout:
      grid_columns: 12
      sections:
        - id: rev_cards
          title: "Key KPIs"
          rows:
            - [ {kpi_card: kpi_arpu}, {kpi_card: kpi_ebitda_margin}, {kpi_card: kpi_cac} ]
            - [ {kpi_card: kpi_revenue_growth}, {kpi_card: kpi_profit_margin}, {kpi_card: kpi_revenue_customer_ltv} ]
        - id: rev_trends
          title: "Trends"
          rows:
            - [ {chart: chart_revenue_trend}, {chart: chart_product_mix} ]
            - [ {chart: chart_revenue_forecast} ]
        - id: rev_tables
          title: "Detail"
          rows:
            - [ {chart: chart_financial_table} ]
  - id: usage_adoption
    title: "📶 Usage & Adoption"
    icon: signal
    order: 4
    description: "Service utilization and feature adoption."
    default_filters: [date_range]
    layout:
      grid_columns: 12
      sections:
        - id: ua_cards
          title: "Key KPIs"
          rows:
            - [ {kpi_card: kpi_data_usage}, {kpi_card: kpi_5g_adoption}, {kpi_card: kpi_feature_adoption} ]
            - [ {kpi_card: kpi_service_penetration}, {kpi_card: kpi_app_usage}, {kpi_card: kpi_premium_adoption} ]
        - id: ua_trends
          title: "Trends"
          rows:
            - [ {chart: chart_plan_usage_mix}, {chart: chart_feature_adoption_trend} ]
            - [ {chart: chart_usage_distribution} ]
  - id: operational_efficiency
    title: "🛠️ Operational Efficiency"
    icon: wrench
    order: 5
    description: "Operational performance, compliance, and reliability."
    default_filters: [date_range, ops_region]
    layout:
      grid_columns: 12
      sections:
        - id: ops_cards
          title: "Key KPIs"
          rows:
            - [ {kpi_card: kpi_service_response_time}, {kpi_card: kpi_reg_compliance}, {kpi_card: kpi_capex_ratio} ]
            - [ {kpi_card: kpi_network_efficiency}, {kpi_card: kpi_ticket_resolution}, {kpi_card: kpi_system_uptime} ]
        - id: ops_trends
          title: "Trends"
          rows:
            - [ {chart: chart_response_time_region}, {chart: chart_incident_heatmap} ]
            - [ {chart: chart_uptime_trend_ops} ]
  - id: benchmark_management
    title: "🎯 Benchmark Management"
    icon: target
    order: 6
    description: "Maintain peer and industry benchmark targets."
    default_filters: []
    layout:
      grid_columns: 12
      sections:
        - id: bm_editor
          title: "Benchmarks"
          rows:
            - [ {widget: widget_benchmark_table} ]
            - [ {widget: widget_benchmark_history} ]
            - [ {widget: widget_benchmark_editor} ]

# KPI definitions include assumptions where existing code uses simulated values.
# Comments mark inferred thresholds from fallback defaults.
kpis:
  - id: kpi_network_availability
    title: "Network Availability"
    subject_area: network_performance
    description: "Percentage of time the network is operational."
    owner: lee.chen@company.com
    tags: [sla, uptime]
    metrics:
      - id: metric_network_availability
        data_source: snowflake_main
        fallback_source: sqlite_cache
        sql: |
          SELECT
            date_id AS date,
            region_name AS region,
            AVG(availability_percent) AS availability_pct,
            MAX(availability_percent) AS max_availability
          FROM vw_network_metrics_daily
          WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
            {% if filters.region %}AND region_name = {{ filters.region | quote }}{% endif %}
            {% if filters.network_element %}
              AND network_element_name IN ({{ filters.network_element | csv }})
            {% endif %}
          GROUP BY 1, 2
        dimensions: [date, region]
        cache_ttl_seconds: 300
        thresholds:  # Assumption: Good >=99.7 based on legacy tooltip copy
          good: ">= 99.7"
          warn: ">= 99.0"
          bad: "< 99.0"
    widgets:
      primary:
        type: kpi_card
        dataset: metric_network_availability
        value_expr: last_value(availability_pct)
        delta_expr: percent_delta(availability_pct)
        unit: "%"
        decimals: 2
      secondary:
        - chart_id: chart_uptime_trend
          type: timeseries_line
          dataset: metric_network_availability
          encoding:
            x: date
            y: availability_pct
            color: region
            tooltip: [date, region, availability_pct]
  - id: kpi_network_latency
    title: "Average Latency"
    subject_area: network_performance
    description: "Average network latency in milliseconds."
    owner: lee.chen@company.com
    tags: [latency]
    metrics:
      - id: metric_network_latency
        data_source: snowflake_main
        sql: |
          SELECT
            date_id AS date,
            region_name AS region,
            AVG(avg_latency_ms) AS latency_ms
          FROM vw_network_metrics_daily
          WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
            {% if filters.region %}AND region_name = {{ filters.region | quote }}{% endif %}
          GROUP BY 1, 2
        dimensions: [date, region]
        cache_ttl_seconds: 300
        thresholds:
          good: "<= 40"
          warn: "<= 60"
          bad: "> 60"
    widgets:
      primary:
        type: kpi_card
        dataset: metric_network_latency
        value_expr: last_value(latency_ms)
        delta_expr: delta(latency_ms)
        unit: "ms"
        decimals: 1
      secondary:
        - chart_id: chart_latency_trend
          type: timeseries_line
          dataset: metric_network_latency
          encoding:
            x: date
            y: latency_ms
            color: region
  - id: kpi_packet_loss
    title: "Packet Loss Rate"
    subject_area: network_performance
    description: "Average packet loss percentage."
    owner: lee.chen@company.com
    tags: [quality]
    metrics:
      - id: metric_packet_loss
        data_source: snowflake_main
        sql: |
          SELECT
            date_id AS date,
            region_name AS region,
            AVG(avg_packet_loss_percent) AS packet_loss_pct
          FROM vw_network_metrics_daily
          WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
            {% if filters.region %}AND region_name = {{ filters.region | quote }}{% endif %}
          GROUP BY 1, 2
        dimensions: [date, region]
        thresholds:
          good: "<= 0.3"
          warn: "<= 0.7"
          bad: "> 0.7"
    widgets:
      primary:
        type: kpi_card
        dataset: metric_packet_loss
        value_expr: last_value(packet_loss_pct)
        delta_expr: delta(packet_loss_pct)
        unit: "%"
        decimals: 2
      secondary:
        - chart_id: chart_packet_loss_trend
          type: area_chart
          dataset: metric_packet_loss
          encoding:
            x: date
            y: packet_loss_pct
            color: region
  - id: kpi_bandwidth_utilization
    title: "Bandwidth Utilization"
    subject_area: network_performance
    description: "Average bandwidth utilization percentage."
    owner: lee.chen@company.com
    tags: [capacity]
    metrics:
      - id: metric_bandwidth_util
        data_source: snowflake_main
        sql: |
          SELECT
            region_name AS region,
            AVG(avg_bandwidth_utilization_percent) AS bandwidth_util_pct
          FROM vw_network_metrics_daily
          WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
          GROUP BY 1
        dimensions: [region]
        thresholds:
          good: "<= 70"
          warn: "<= 85"
          bad: "> 85"
    widgets:
      primary:
        type: kpi_card
        dataset: metric_bandwidth_util
        value_expr: weighted_avg(bandwidth_util_pct)
        delta_expr: delta(bandwidth_util_pct)
        unit: "%"
        decimals: 1
      secondary:
        - chart_id: chart_bandwidth_region
          type: bar_chart
          dataset: metric_bandwidth_util
          encoding:
            x: region
            y: bandwidth_util_pct
  - id: kpi_dropped_call_rate
    title: "Dropped Call Rate"
    subject_area: network_performance
    description: "Share of calls dropped across the network."
    owner: lee.chen@company.com
    tags: [voice]
    metrics:
      - id: metric_dropped_calls
        data_source: snowflake_main
        sql: |
          SELECT
            date_id AS date,
            region_name AS region,
            AVG(avg_dropped_call_rate) AS dropped_call_pct
          FROM vw_network_metrics_daily
          WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
          GROUP BY 1, 2
        dimensions: [date, region]
        thresholds:
          good: "<= 0.4"
          warn: "<= 0.6"
          bad: "> 0.6"
    widgets:
      primary:
        type: kpi_card
        dataset: metric_dropped_calls
        value_expr: last_value(dropped_call_pct)
        delta_expr: delta(dropped_call_pct)
        unit: "%"
        decimals: 2
  - id: kpi_mttr
    title: "Mean Time To Repair"
    subject_area: network_performance
    description: "Average hours to resolve critical incidents."
    owner: lee.chen@company.com
    tags: [operations]
    metrics:
      - id: metric_mttr
        data_source: snowflake_main
        sql: |
          SELECT
            date_id AS date,
            region_name AS region,
            AVG(avg_mttr_hours) AS mttr_hours
          FROM vw_network_metrics_daily
          WHERE date_id BETWEEN {{ date_range.start }} AND {{ date_range.end }}
          GROUP BY 1, 2
        dimensions: [date, region]
        thresholds:
          good: "<= 2.5"
          warn: "<= 4"
          bad: "> 4"
    widgets:
      primary:
        type: kpi_card
        dataset: metric_mttr
        value_expr: last_value(mttr_hours)
        delta_expr: delta(mttr_hours)
        unit: "h"
        decimals: 2

  # Customer Experience KPIs
