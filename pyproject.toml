[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telecomdashboard"
version = "0.1.0"
description = "Streamlit telecom KPI dashboard with optional AI insights"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Anonymous"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "altair>=5.0.0",
    "PyYAML>=6.0",
    "plotly>=5.15.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "pydantic>=1.8.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "psycopg2-binary>=2.9",
    "snowflake-connector-python>=4.3",
    "sqlalchemy>=2.0",
]
enterprise = [
    "psycopg2-binary>=2.9",
    "snowflake-connector-python>=4.3",
    "sqlalchemy>=2.0",
]

[project.scripts]
telecomdashboard = "telecomdashboard.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
ignore = []
